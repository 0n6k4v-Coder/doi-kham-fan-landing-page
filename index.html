<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>DOI KHAM</title>

  <link rel="stylesheet" href="./styles/global.css">
  <link rel="stylesheet" href="./components/hero/doi-kham-hero.css">
</head>

<body>
  <div class="page">
    <header class="header">
      <img
        class="header__logo"
        src="./assets/images/logo.png"
        alt="DOI KHAM"
      >
    </header>

    <main class="main">
      <section class="hero-transition" aria-label="Hero">
        <div class="hero-stage">
          <doi-kham-hero></doi-kham-hero>
        </div>

        <div class="organic-wipe" aria-hidden="true">
          <div class="organic-wipe__layer organic-wipe__layer--back"></div>
          <div class="organic-wipe__layer organic-wipe__layer--front"></div>
          <div class="organic-wipe__highlight"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
