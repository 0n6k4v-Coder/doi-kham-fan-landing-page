<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOI KHAM</title>
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="stylesheet" href="./components/hero/doi-kham-hero.css">
  <link rel="stylesheet" href="./components/tomato-detail/doi-kham-tomato-detail.css">
  <link rel="stylesheet" href="./components/vdo/doi-kham-vdo.css">
  <link rel="stylesheet" href="./components/about/doi-kham-about.css">
  <link rel="stylesheet" href="./components/product-gallery/doi-kham-product-gallery.css">
  <link rel="stylesheet" href="./components/product-line/doi-kham-product-line.css">
  <link rel="stylesheet" href="./components/brand-story/doi-kham-brand-story.css">
  <link rel="stylesheet" href="./components/news/doi-kham-news.css">
  <link rel="stylesheet" href="./components/faq/doi-kham-faq.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <img class="header__logo" src="./assets/images/logo.png" alt="DOI KHAM">
    </header>
    <main class="main">
      <section class="hero-organic-section" aria-label="Hero and tomato details">
        <div class="hero-stage">
          <doi-kham-hero></doi-kham-hero>
        </div>
        <section class="organic-section" aria-label="Tomato details">
          <div class="organic-surface">
            <div class="organic-surface__top-circle" aria-hidden="true"></div>
            <div class="organic-container">
              <doi-kham-tomato-detail></doi-kham-tomato-detail>
              <doi-kham-vdo></doi-kham-vdo>
              <doi-kham-about></doi-kham-about>
              <doi-kham-product-gallery></doi-kham-product-gallery>
              <doi-kham-product-line></doi-kham-product-line>
              <doi-kham-brand-story></doi-kham-brand-story>
            </div>
          </div>
        </section>
      </section>
      <div class="news-faq-section">
        <div class="organic-surface__bottom-circle" aria-hidden="true"></div>
        <section class="news-section" aria-labelledby="news-title">
          <doi-kham-news></doi-kham-news>
        </section>
        <section class="faq-section" aria-labelledby="faq-title">
          <doi-kham-faq></doi-kham-faq>
        </section>
        <div class="organic-surface__top-circle" aria-hidden="true"></div>
      </div>
      <section class="contact-section" aria-label="Contact">
        <div class="contact-container"></div>
      </section>
    </main>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
