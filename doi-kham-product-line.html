<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOI KHAM - Red Harvest Line</title>

  <style>
    :root {
      --line-up-title-color: #FDC000;
      --card-text-color: #FFFFFF;

      --card-low-sodium-bg: #47CDFA;
      --card-original-bg: #EEDD7F;
      --card-mocktail-bg: #F480CB;

      --button-low-sodium-bg: #D84315;
      --button-original-bg: #2E5A27;
      --button-mocktail-bg: #47CDFA;

      --line-up-block-padding: clamp(32px, 6vw, 72px);
      --line-up-gap: clamp(20px, 3vw, 32px);

      --line-up-logo-size: 72px;

      --line-up-title-size: clamp(30px, 4vw, 48px);
      --line-up-title-weight: 900;

      --product-card-gap: clamp(16px, 3vw, 32px);
      --product-cards-max-width: 1400px;
      --product-card-ratio: 45 / 38;

      --product-card-padding: clamp(20px, 3vw, 32px);
      --product-card-radius: 24px;

      --product-card-row-gap: clamp(20px, 3vw, 32px);
      --product-card-inner-gap: clamp(16px, 2vw, 28px);

      --product-name-size: clamp(22px, 2.9cqw, 34px);
      --product-name-weight: 900;
      --product-name-line-height: 1.16;

      --product-price-size: clamp(20px, 2vw, 28px);
      --product-price-weight: 900;

      --product-button-size: clamp(44px, 5vw, 56px);
      --product-button-font-size: clamp(24px, 3vw, 32px);

      --product-card-column-size: calc(
        (100% - var(--product-card-inner-gap)) / 2
      );

      --mobile-card-width: min(82vw, 380px);

      --product-card-hover-duration: 320ms;
      --product-card-hover-easing: cubic-bezier(0.22, 1, 0.36, 1);
      --product-card-hover-rotate: -4deg;
      --product-image-hover-rotate: 6deg;
      --product-image-hover-scale: 1.08;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .product-line-up {
      width: 100%;
      padding-block: var(--line-up-block-padding);
    }

    .product-line-up__container {
      container: product-line-up / inline-size;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: var(--line-up-gap);
    }

    .product-line-up__logo {
      display: block;
      width: var(--line-up-logo-size);
      height: var(--line-up-logo-size);
      flex: 0 0 auto;
      object-fit: contain;
      object-position: center;
    }

    .product-line-up__title {
      display: block;
      width: max-content;
      max-width: 100%;
      margin: 0;
      color: var(--line-up-title-color);
      font-size: var(--line-up-title-size);
      line-height: 1;
      font-weight: var(--line-up-title-weight);
      text-align: center;
      white-space: nowrap;
    }

    .product-line-up__content {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: var(--product-cards-max-width);
      min-width: 0;
    }

    .product-line-up__cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
      width: 100%;
      min-width: 0;
      gap: var(--product-card-gap);
    }

    .product-card-shell {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 0;
      aspect-ratio: var(--product-card-ratio);
      overflow: visible;
    }

    .product-card-back {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      border-radius: var(--product-card-radius);
      background-color: var(--product-card-back-bg);
      pointer-events: none;
    }

    .product-card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      padding: var(--product-card-padding);
      gap: var(--product-card-row-gap);
      border-radius: var(--product-card-radius);
      color: var(--card-text-color);
      overflow: hidden;
      transform: none;
      transform-origin: center;
    }

    .product-card--low-sodium {
      background-color: var(--card-low-sodium-bg);
      --button-bg: var(--button-low-sodium-bg);
    }

    .product-card--original {
      background-color: var(--card-original-bg);
      --button-bg: var(--button-original-bg);
    }

    .product-card--mocktail {
      background-color: var(--card-mocktail-bg);
      --button-bg: var(--button-mocktail-bg);
    }

    .product-card__main {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      min-height: 0;
      gap: var(--product-card-inner-gap);
      overflow: hidden;
    }

    .product-card__text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      flex: 0 1 var(--product-card-column-size);
      width: var(--product-card-column-size);
      max-width: var(--product-card-column-size);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .product-card__name {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      margin: 0;
      padding: 0;
      color: var(--card-text-color);
      font-size: var(--product-name-size);
      line-height: var(--product-name-line-height);
      font-weight: var(--product-name-weight);
      overflow: hidden;
    }

    .product-card__name span {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      margin: 0;
      padding: 0;
      overflow-wrap: anywhere;
      overflow: hidden;
    }

    .product-card__image-wrap {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      flex: 0 1 var(--product-card-column-size);
      width: var(--product-card-column-size);
      max-width: var(--product-card-column-size);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .product-card__image {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: top right;
      user-select: none;
      -webkit-user-drag: none;
      transform: none;
      transform-origin: center;
    }

    .product-card__footer {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      gap: var(--product-card-inner-gap);
      overflow: hidden;
    }

    .product-card__price {
      display: block;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
      margin: 0;
      padding: 0;
      color: var(--card-text-color);
      font-size: var(--product-price-size);
      line-height: 1;
      font-weight: var(--product-price-weight);
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .product-card__button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 var(--product-button-size);
      width: var(--product-button-size);
      height: var(--product-button-size);
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background-color: var(--button-bg);
      color: #FFFFFF;
      font-size: var(--product-button-font-size);
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      appearance: none;
    }

    .product-card__button:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 4px;
    }

    .product-line-up__controls {
      display: none;
    }

    @media (hover: hover) and (min-width: 561px) {
      .product-line-up__content,
      .product-line-up__cards,
      .product-card-shell,
      .product-card,
      .product-card__main,
      .product-card__image-wrap {
        overflow: visible;
      }

      .product-card {
        transition:
          transform var(--product-card-hover-duration)
          var(--product-card-hover-easing);
      }

      .product-card__image {
        transition:
          transform var(--product-card-hover-duration)
          var(--product-card-hover-easing);
      }

      .product-card-shell:hover {
        z-index: 2;
      }

      .product-card-shell:hover .product-card {
        z-index: 1;
        transform: rotate(var(--product-card-hover-rotate));
      }

      .product-card-shell:hover .product-card__image {
        transform:
          rotate(var(--product-image-hover-rotate))
          scale(var(--product-image-hover-scale));
      }
    }

    @media (hover: hover) and (min-width: 561px) and (prefers-reduced-motion: reduce) {
      .product-card,
      .product-card__image {
        transition: none;
      }

      .product-card-shell:hover .product-card {
        transform: none;
      }

      .product-card-shell:hover .product-card__image {
        transform: none;
      }
    }

    @container product-line-up (max-width: 1000px) {
      .product-line-up__cards {
        gap: clamp(12px, 2.5cqw, 24px);
      }

      .product-card {
        padding: clamp(16px, 2.5cqw, 28px);
      }

      .product-card__main,
      .product-card__footer {
        gap: clamp(12px, 2cqw, 22px);
      }

      .product-card__name {
        font-size: clamp(20px, 3cqw, 32px);
        line-height: 1.16;
      }
    }

    @media (max-width: 560px) {
      :root {
        --line-up-block-padding: 32px;
        --line-up-logo-size: 64px;

        --product-card-gap: 16px;

        --product-card-padding: 20px;
        --product-card-row-gap: 20px;
        --product-card-inner-gap: 16px;

        --product-name-size: clamp(22px, 7vw, 30px);
        --product-name-line-height: 1.16;

        --product-price-size: clamp(24px, 7vw, 34px);

        --product-button-size: 48px;
        --product-button-font-size: 28px;

        --mobile-card-width: min(82vw, 380px);
      }

      .product-line-up__title {
        width: 100%;
        max-width: 100%;
        font-size: clamp(26px, 8vw, 34px);
        line-height: 1.05;
        white-space: normal;
      }

      .product-line-up__content {
        display: block;
        width: 100%;
        max-width: none;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-padding-inline:
          calc(
            (100% - var(--mobile-card-width)) / 2
          );
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .product-line-up__content::-webkit-scrollbar {
        display: none;
      }

      .product-line-up__cards {
        display: flex;
        flex-wrap: nowrap;
        align-items: stretch;
        width: max-content;
        min-width: max-content;
        gap: var(--product-card-gap);
      }

      .product-card-shell {
        flex: 0 0 var(--mobile-card-width);
        width: var(--mobile-card-width);
        max-width: var(--mobile-card-width);
        aspect-ratio: var(--product-card-ratio);
        scroll-snap-align: center;
        scroll-snap-stop: always;
        overflow: visible;
      }

      .product-card-back {
        display: none;
      }

      .product-card {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        overflow: hidden;
        transform: none;
      }

      .product-card__main {
        flex-direction: row;
        overflow: hidden;
      }

      .product-card__text,
      .product-card__image-wrap {
        flex: 0 1 var(--product-card-column-size);
        width: var(--product-card-column-size);
        max-width: var(--product-card-column-size);
        min-width: 0;
      }

      .product-card__image-wrap {
        overflow: hidden;
      }

      .product-card__image {
        transform: none;
      }

      .product-card__name {
        font-size: var(--product-name-size);
        line-height: var(--product-name-line-height);
      }

      .product-card__price {
        font-size: var(--product-price-size);
      }

      .product-line-up__controls {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        width: 100%;
        gap: 12px;
      }

      .product-line-up__control {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .product-line-up__control-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 62px;
        height: 62px;
        padding: 0;
        border: 0;
        border-radius: 16px;
        background-color: #025627;
        color: #FFFFFF;
        cursor: pointer;
        appearance: none;
      }

      .product-line-up__control-button:focus-visible {
        outline: 2px solid #025627;
        outline-offset: 4px;
      }

      .product-line-up__control-button:active {
        transform: scale(0.97);
      }

      .product-line-up__control-icon {
        display: block;
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
      }
    }

    @media (max-width: 320px) {
      :root {
        --line-up-block-padding: 28px;
        --line-up-logo-size: 56px;

        --product-card-padding: 16px;
        --product-card-row-gap: 16px;
        --product-card-inner-gap: 12px;

        --product-price-size: clamp(23px, 7.5vw, 30px);

        --mobile-card-width: 86vw;
      }

      .product-card__name {
        font-size: clamp(20px, 7vw, 26px);
        line-height: 1.16;
      }

      .product-card__price {
        font-size: var(--product-price-size);
      }
    }
  </style>
</head>

<body>

  <section
    class="product-line-up"
    aria-labelledby="product-line-up-title"
  >
    <div class="product-line-up__container">

      <img
        class="product-line-up__logo"
        src="https://www.doikham.co.th/images/layout/header/logo.png"
        alt="DOI KHAM"
        width="72"
        height="72"
      />

      <h2
        class="product-line-up__title"
        id="product-line-up-title"
      >
        RED HARVEST LINE
      </h2>

      <div
        class="product-line-up__content"
        id="product-line-up-content"
      >
        <div
          class="product-line-up__cards"
          id="product-line-up-cards"
        ></div>
      </div>

      <div
        class="product-line-up__controls"
        aria-label="Product carousel controls"
      >
        <div class="product-line-up__control">
          <button
            class="product-line-up__control-button"
            id="product-carousel-prev"
            type="button"
            aria-label="Previous product"
          >
            <svg
              class="product-line-up__control-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M14.5 5.5L8 12l6.5 6.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <div class="product-line-up__control">
          <button
            class="product-line-up__control-button"
            id="product-carousel-next"
            type="button"
            aria-label="Next product"
          >
            <svg
              class="product-line-up__control-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M9.5 5.5L16 12l-6.5 6.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>

    </div>
  </section>

  <script>
    const products = [
      {
        className: "product-card--low-sodium",
        backColor: "#D84315",
        name: ["100%", "TOMATO", "JUICE", "LOW", "SODIUM"],
        image: "https://www.doikham.co.th/_next/image?url=https%3A%2F%2Fdoikham.co.th%2Fcms%2Fuploads%2F100_f242bd5afb.webp&w=640&q=75",
        price: "฿20"
      },
      {
        className: "product-card--original",
        backColor: "#2E5A27",
        name: ["100%", "TOMATO", "JUICE"],
        image: "https://www.doikham.co.th/_next/image?url=https%3A%2F%2Fdoikham.co.th%2Fcms%2Fuploads%2F100_9683800527.webp&w=3840&q=75",
        price: "฿20"
      },
      {
        className: "product-card--mocktail",
        backColor: "#47CDFA",
        name: ["100%", "TOMATO", "JUICE", "MOCK", "TAIL"],
        image: "https://www.doikham.co.th/_next/image?url=https%3A%2F%2Fdoikham.co.th%2Fcms%2Fuploads%2F_b7dfe7218f.webp&w=640&q=75",
        price: "฿20"
      }
    ];

    const content = document.getElementById("product-line-up-content");
    const cards = document.getElementById("product-line-up-cards");
    const previousButton = document.getElementById("product-carousel-prev");
    const nextButton = document.getElementById("product-carousel-next");

    const mobileBreakpoint = 560;
    const productCount = products.length;
    let currentMobileIndex = productCount + 1;
    let isNormalizing = false;
    let isProgrammaticScroll = false;

    function createProductCard(product, clone = false) {
      const shell = document.createElement("div");
      shell.className = "product-card-shell";
      shell.style.setProperty("--product-card-back-bg", product.backColor);

      const backCard = document.createElement("div");
      backCard.className = "product-card-back";
      backCard.setAttribute("aria-hidden", "true");

      const article = document.createElement("article");
      article.className = `product-card ${product.className}`;

      if (clone) {
        shell.setAttribute("aria-hidden", "true");
      }

      article.innerHTML = `
        <div class="product-card__main">
          <div class="product-card__text">
            <h3 class="product-card__name">
              ${product.name.map(line => `<span>${line}</span>`).join("")}
            </h3>
          </div>

          <div class="product-card__image-wrap">
            <img
              class="product-card__image"
              src="${product.image}"
              alt="${product.name.join(" ")}"
              loading="lazy"
              draggable="false"
            />
          </div>
        </div>

        <div class="product-card__footer">
          <p class="product-card__price">${product.price}</p>

          <button
            class="product-card__button"
            type="button"
            aria-label="Add ${product.name.join(" ")}"
          >
            +
          </button>
        </div>
      `;

      shell.appendChild(backCard);
      shell.appendChild(article);

      return shell;
    }

    function renderDesktop() {
      cards.innerHTML = "";

      products.forEach(product => {
        cards.appendChild(createProductCard(product));
      });

      currentMobileIndex = productCount + 1;
      isNormalizing = false;
      isProgrammaticScroll = false;
    }

    function getMobileGap() {
      const card = cards.querySelector(".product-card");
      if (!card) return 0;

      const cardWidth = card.getBoundingClientRect().width;
      const contentStyle = getComputedStyle(cards);
      const gap = parseFloat(contentStyle.columnGap || contentStyle.gap) || 0;

      return {
        cardWidth,
        gap
      };
    }

    function getMobileItemStep() {
      const { cardWidth, gap } = getMobileGap();
      return cardWidth + gap;
    }

    function getMobileStartScrollLeft(index) {
      const step = getMobileItemStep();

      return (
        step * index -
        (content.clientWidth - cards.querySelector(".product-card").getBoundingClientRect().width) / 2
      );
    }

    function renderMobile() {
      cards.innerHTML = "";

      products.forEach(product => {
        cards.appendChild(createProductCard(product, true));
      });

      products.forEach(product => {
        cards.appendChild(createProductCard(product));
      });

      products.forEach(product => {
        cards.appendChild(createProductCard(product, true));
      });

      currentMobileIndex = productCount + 1;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const card = cards.querySelector(".product-card");

          if (!card) return;

          const step = getMobileItemStep();

          content.scrollLeft =
            step * currentMobileIndex -
            (content.clientWidth - card.getBoundingClientRect().width) / 2;
        });
      });
    }

    function isMobile() {
      return window.innerWidth <= mobileBreakpoint;
    }

    function scrollToMobileIndex(index, behavior = "smooth") {
      const card = cards.querySelector(".product-card");

      if (!card) return;

      currentMobileIndex = index;

      const step = getMobileItemStep();

      const target =
        step * index -
        (content.clientWidth - card.getBoundingClientRect().width) / 2;

      isProgrammaticScroll = true;

      content.scrollTo({
        left: target,
        behavior
      });
    }

    function normalizeMobilePosition() {
      if (!isMobile() || isNormalizing) return;

      if (currentMobileIndex >= productCount * 2) {
        isNormalizing = true;

        const normalizedIndex = currentMobileIndex - productCount;

        currentMobileIndex = normalizedIndex;

        const card = cards.querySelector(".product-card");
        if (!card) {
          isNormalizing = false;
          return;
        }

        const step = getMobileItemStep();

        const target =
          step * normalizedIndex -
          (content.clientWidth - card.getBoundingClientRect().width) / 2;

        content.style.scrollSnapType = "none";
        content.scrollLeft = target;

        requestAnimationFrame(() => {
          content.style.scrollSnapType = "x mandatory";
          isNormalizing = false;
        });

        return;
      }

      if (currentMobileIndex < productCount) {
        isNormalizing = true;

        const normalizedIndex = currentMobileIndex + productCount;

        currentMobileIndex = normalizedIndex;

        const card = cards.querySelector(".product-card");
        if (!card) {
          isNormalizing = false;
          return;
        }

        const step = getMobileItemStep();

        const target =
          step * normalizedIndex -
          (content.clientWidth - card.getBoundingClientRect().width) / 2;

        content.style.scrollSnapType = "none";
        content.scrollLeft = target;

        requestAnimationFrame(() => {
          content.style.scrollSnapType = "x mandatory";
          isNormalizing = false;
        });
      }
    }

    function getNearestMobileIndex() {
      const card = cards.querySelector(".product-card");

      if (!card) return currentMobileIndex;

      const step = getMobileItemStep();

      const centeredOffset =
        (content.clientWidth - card.getBoundingClientRect().width) / 2;

      const rawIndex =
        (content.scrollLeft + centeredOffset) / step;

      return Math.round(rawIndex);
    }

    function handleScrollEnd() {
      if (!isMobile()) return;

      currentMobileIndex = getNearestMobileIndex();

      normalizeMobilePosition();

      isProgrammaticScroll = false;
    }

    function handlePrevious() {
      if (!isMobile()) return;

      const index = getNearestMobileIndex();

      scrollToMobileIndex(index - 1);
    }

    function handleNext() {
      if (!isMobile()) return;

      const index = getNearestMobileIndex();

      scrollToMobileIndex(index + 1);
    }

    function render() {
      if (isMobile()) {
        renderMobile();
      } else {
        renderDesktop();
      }
    }

    previousButton.addEventListener("click", handlePrevious);
    nextButton.addEventListener("click", handleNext);

    if ("onscrollend" in window) {
      content.addEventListener("scrollend", handleScrollEnd);
    } else {
      let scrollEndTimer;

      content.addEventListener("scroll", () => {
        if (!isMobile()) return;

        clearTimeout(scrollEndTimer);

        scrollEndTimer = setTimeout(() => {
          handleScrollEnd();
        }, 100);
      });
    }

    content.addEventListener("scroll", () => {
      if (!isMobile() || isNormalizing) return;

      currentMobileIndex = getNearestMobileIndex();

      const normalizedUpper = productCount * 2 + 0.5;
      const normalizedLower = productCount - 0.5;

      if (
        currentMobileIndex >= normalizedUpper ||
        currentMobileIndex <= normalizedLower
      ) {
        normalizeMobilePosition();
      }
    });

    const resizeObserver = new ResizeObserver(() => {
      if (!isMobile()) {
        return;
      }

      requestAnimationFrame(() => {
        const currentIndex = getNearestMobileIndex();

        currentMobileIndex = Math.min(
          productCount * 2 - 1,
          Math.max(productCount, currentIndex)
        );

        const card = cards.querySelector(".product-card");
        if (!card) return;

        const step = getMobileItemStep();

        const target =
          step * currentMobileIndex -
          (content.clientWidth - card.getBoundingClientRect().width) / 2;

        content.style.scrollSnapType = "none";
        content.scrollLeft = target;

        requestAnimationFrame(() => {
          content.style.scrollSnapType = "x mandatory";
        });
      });
    });

    resizeObserver.observe(content);

    let lastMobileState = isMobile();

    window.addEventListener("resize", () => {
      const currentMobileState = isMobile();

      if (currentMobileState === lastMobileState) {
        return;
      }

      lastMobileState = currentMobileState;
      render();
    });

    render();
  </script>

</body>
</html>
