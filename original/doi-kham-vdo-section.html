<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOI KHAM - Video</title>

  <style>
    :root {
      /* =========================
         Video Section
      ========================= */
      --video-section-bg: #FFF9E6;

      --video-section-block-padding: clamp(32px, 6vw, 72px);
      --video-section-inline-padding: clamp(20px, 5vw, 72px);

      --video-container-width: 1270px;

      --video-ratio-desktop: 1270 / 715;
      --video-ratio-mobile: 392 / 320;

      --video-radius: 24px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--video-section-bg);
    }

    /* =========================
       Video Section
    ========================= */
    .video-section {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding-block: var(--video-section-block-padding);
      padding-inline: var(--video-section-inline-padding);
      background-color: var(--video-section-bg);
    }

    /* =========================
       Parent Container
    ========================= */
    .video-section__container {
      container: video-section / inline-size;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(100%, var(--video-container-width));
      min-width: 0;
    }

    /* =========================
       Video Player
    ========================= */
    .video-player {
      display: block;
      width: 100%;
      max-width: var(--video-container-width);
      height: auto;
      aspect-ratio: var(--video-ratio-desktop);

      margin: 0;
      padding: 0;
      border: 0;
      border-radius: var(--video-radius);

      background-color: #000000;
      object-fit: cover;
      object-position: center;

      overflow: hidden;
    }

    /* =========================
       Mobile
       392 × 320
    ========================= */
    @container video-section (max-width: 700px) {
      .video-section__container {
        width: 100%;
      }

      .video-player {
        width: 100%;
        max-width: 100%;
        aspect-ratio: var(--video-ratio-mobile);
      }
    }

    /* =========================
       Very Small Mobile
    ========================= */
    @container video-section (max-width: 400px) {
      .video-player {
        width: 100%;
        aspect-ratio: var(--video-ratio-mobile);
      }
    }
  </style>
</head>

<body>

  <section class="video-section" aria-label="DOI KHAM video">

    <div class="video-section__container">

      <video
        class="video-player"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
      >
        <source
          src="videoplayback.mp4"
          type="video/mp4"
        />

        Your browser does not support the video element.
      </video>

    </div>

  </section>

</body>
</html>
